<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Feedback Form</title>
  </head>
  <body>
    <header>
      <h1>Hotel Feedback Form</h1>
      <p>
        Thank you for staying with us. Please provide feedback on your recent
        stay.
      </p>
    </header>
    <main>
      <form>
        <fieldset>
          <legend>Personal Information</legend>
          <label for="name"
            >Name (required): <input type="text" id="name" name="name" required
          /></label>
          <label for="email"
            >Email (required):
            <input type="email" id="email" name="email" required
          /></label>
          <label for="age"
            >Age (optional): <input type="number" id="age" name="age"
          /></label>
        </fieldset>
        <fieldset>
          <legend>Was this your first time at our hotel?</legend>
          <label for="first-time-yes">Yes</label>
          <input
            type="radio"
            id="first-time-yes"
            name="first-time"
            value="yes"
          />
          <label for="first-time-no">No</label>
          <input type="radio" id="first-time-no" name="first-time" value="no" />
        </fieldset>
        <fieldset>
          <legend>
            Why did your choose to stay at our hotel? (Check all that apply)
          </legend>
          <input
            type="checkbox"
            id="social-media"
            name="reason"
            value="social-media"
          />
          <label for="social-media">Social Media</label>
          <input
            type="checkbox"
            id="personal-recommendation"
            name="reason"
            value="personal-recommendation"
          />
          <label for="personal-recommendation">Personal Recommendation</label>
          <input type="checkbox" id="location" name="reason" value="location" />
          <label for="location">Location</label>
          <input
            type="checkbox"
            id="reputation"
            checked
            name="reason"
            value="reputation"
          />
          <label for="reputation">Reputation</label>
          <input type="checkbox" id="price" name="reason" value="price" />
          <label for="price">Price</label>
        </fieldset>
        <fieldset>
          <legend>Ratings</legend>
          <label for="service">How was the service?</label>
          <select name="service" id="service">
            <option value="Excellent" selected>Excellent</option>
            <option value="Good">Good</option>
            <option value="Average">Average</option>
            <option value="Poor">Poor</option>
          </select>

          <label for="food">How was the food?</label>
          <select name="food" id="food">
            <option value="Excellent" selected>Excellent</option>
            <option value="Good">Good</option>
            <option value="Average">Average</option>
            <option value="Poor">Poor</option>
          </select>
        </fieldset>
        <label for="comments">Other Comments</label>
        <textarea name="comments" id="comments" cols="30" rows="10"></textarea>
        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
