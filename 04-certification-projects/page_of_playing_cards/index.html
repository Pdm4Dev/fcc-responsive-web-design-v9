<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="playing-cards">
      <div class="card">
        <div class="left">
          <div>A</div>
          <div>♠</div>
        </div>
        <div class="middle">
          <div>♠</div>
        </div>
        <div class="right flipped">
          <div>A</div>
          <div>♠</div>
        </div>
      </div>
      <div class="card">
        <div class="left">
          <div class="rank">2</div>
          <div>♣</div>
        </div>
        <div class="middle">
          <div>♣</div>
          <div class="flipped">♣</div>
        </div>
        <div class="right flipped">
          <div>♣</div>
          <div>A</div>
        </div>
      </div>
      <div class="card">
        <div class="left red">
          <div>3</div>
          <div>♥</div>
        </div>
        <div class="middle red">
          <div>♥</div>
          <div>♥</div>
          <div class="flipped">♥</div>
        </div>
        <div class="right red flipped">
          <div>3</div>
          <div>♥</div>
        </div>
      </div>
      <div class="card">
        <div class="left red">
          <div>A</div>
          <div>♦</div>
        </div>
        <div class="middle red">
          <div>♦</div>
        </div>
        <div class="right red flipped">
          <div>A</div>
          <div>♦</div>
        </div>
      </div>
    </main>
  </body>
</html>
